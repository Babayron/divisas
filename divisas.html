<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cambio de Divisas</title>
<link rel="stylesheet" href="styles.css">
</head>


<body>

<div id="divisas-container">
  <h1>Cambio de Divisas</h1>
  <p class="subtitulo">Convierte entre diferentes monedas.</p>

  <label for="tabla-divisas">Desde</label>
  <select id="tabla-divisas">
    <option value="">Selecciona una divisa</option>
  </select>

  <label for="tabla-comparar">Hacia</label>
  <select id="tabla-comparar">
    <option value="">Selecciona una divisa</option>
  </select>

  <label for="cantidad">Cantidad</label>
  <input type="number" id="cantidad" placeholder="Cantidad">

  <button id="convertir">Convertir</button>
</div>

<script src="script.js"></script>

</body>
</html>
